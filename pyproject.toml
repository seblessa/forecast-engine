[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-engine"
version = "0.2.0"
description = "Reusable forecasting core and REST API built on official Amazon Chronos"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chronos-forecasting>=2.3.1,<2.4",
    "fastapi>=0.115,<1",
    "pandas>=2.2,<4",
    "python-multipart>=0.0.20,<1",
    "torch>=2.2,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.10,<3",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["forecast_engine"]
include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
