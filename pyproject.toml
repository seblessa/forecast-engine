[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forecast-engine"
version = "0.1.0"
description = "REST API for chronos_forecaster"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "chronos_forecaster>=0.2.2,<0.3",
    "fastapi>=0.115,<1",
    "pandas>=2.2,<4",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
]

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
